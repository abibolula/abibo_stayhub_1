<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Abibo Studio</title>
<style>

  /* ============================================================
     1. TOKEN / VARIABEL TAMPILAN
     Ubah warna, jarak, dan radius di sini untuk mengubah
     tampilan seluruh halaman.
  ============================================================ */
  :root{
    --paper:      #F5F3EC;
    --paper-soft: #EFEBE0;
    --ink:        #1F2420;
    --ink-soft:   #5B6259;
    --sage:       #445340;
    --sage-deep:  #303B2D;
    --gold:       #B98B2E;
    --line:       #DCD6C6;
    --card-bg:    #FFFFFF;
    --wa:         #2E5F45;
    --wa-deep:    #204333;

    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;

    --maxw: 880px;
    --gap: 20px;

    --font-display: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  *{ box-sizing: border-box; }
  html{ -webkit-text-size-adjust: 100%; overflow-x: hidden; }
  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }

  /* Dekorasi latar lembut — memberi kedalaman di layar besar tanpa
     mengganggu tampilan di HP (tetap halus, non-interaktif). */
  body::before,
  body::after{
    content: "";
    position: fixed;
    z-index: -1;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
  }
  body::before{
    width: 480px;
    height: 480px;
    top: -160px;
    right: -140px;
    background: radial-gradient(circle, var(--gold) 0%, transparent 72%);
    opacity: .22;
  }
  body::after{
    width: 560px;
    height: 560px;
    bottom: -220px;
    left: -180px;
    background: radial-gradient(circle, var(--sage) 0%, transparent 72%);
    opacity: .16;
  }

  ::selection{ background: var(--gold); color: #fff; }

  a{ color: inherit; }
  button{ font-family: inherit; }

  :focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  /* ---------- SCROLL REVEAL ----------
     Ditambahkan via JS ke kartu, item langkah, item FAQ, dan judul
     section. Kelas "reveal" = kondisi awal tersembunyi, "is-visible"
     ditambahkan lewat IntersectionObserver saat elemen masuk layar.
  ------------------------------------- */
  .reveal{
    opacity: 0;
    transform: translateY(16px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .reveal.is-visible{
    opacity: 1;
    transform: translateY(0);
  }
  /* Kartu sudah punya animasi hover sendiri (transform), jadi saat
     reveal cukup fade tanpa geser supaya tidak tabrakan dengan efek hover. */
  .card.reveal{
    transform: none;
    transition: border-color .18s ease, transform .18s ease, opacity .5s ease;
  }
  .card.reveal.is-visible{ opacity: 1; }

  .wrap{
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 20px;
  }

  /* ---------- HEADER ---------- */
  header.hero{
    padding: 56px 0 40px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }

  .logo-badge{
    width: 76px;
    height: 76px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(0,0,0,.03);
  }
  .logo-badge img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .logo-badge .logo-fallback{
    font-family: var(--font-display);
    font-size: 26px;
    color: var(--sage-deep);
    letter-spacing: .02em;
  }

  h1.site-title{
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(30px, 6vw, 42px);
    margin: 0 0 10px;
    color: var(--sage-deep);
  }

  p.tagline{
    margin: 0 auto 22px;
    max-width: 46ch;
    color: var(--ink-soft);
    font-size: 15.5px;
  }

  p.intro{
    margin: 0 auto;
    max-width: 52ch;
    font-size: 15px;
    color: var(--ink-soft);
    padding-top: 16px;
    border-top: 1px solid var(--line);
    display: inline-block;
  }

  /* ---------- TAB KATEGORI ---------- */
  .tabs-nav{
    position: relative;
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 34px 0 6px;
    padding-bottom: 2px;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs-nav::-webkit-scrollbar{ display: none; }

  .tab-btn{
    position: relative;
    background: none;
    border: none;
    padding: 10px 18px 14px;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 16.5px;
    letter-spacing: .02em;
    color: var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
    transition: color .2s ease;
  }
  .tab-btn:hover{ color: var(--sage-deep); }
  .tab-btn:active{ opacity: .7; }
  .tab-btn[aria-selected="true"]{
    color: var(--sage-deep);
    font-weight: 600;
  }

  .tab-indicator{
    position: absolute;
    bottom: -1px;
    height: 2px;
    background: var(--gold);
    border-radius: 2px;
    transition: left .28s cubic-bezier(.65,0,.35,1), width .28s cubic-bezier(.65,0,.35,1);
  }

  .tab-panel{ padding-top: 30px; }
  .tab-panel[hidden]{ display: none; }

  /* ---------- GRID KARTU ---------- */
  main{
    padding: 12px 0 90px;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: var(--gap);
  }

  .card{
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 14px 16px 22px;
    text-align: center;
    cursor: pointer;
    position: relative;
    transition: border-color .18s ease, transform .18s ease;
    overflow: hidden;
  }
  .card:hover{
    border-color: var(--sage);
  }
  .card:active{
    transform: scale(.99);
  }
  .card.is-open{
    border-color: var(--sage);
  }

  /* --- Kotak preview website: iframe hanya dimuat saat kartu diketuk --- */
  .card-preview{
    position: relative;
    width: calc(100% + 32px);
    margin: -14px -16px 14px;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: var(--paper-soft);
    border-bottom: 1px solid var(--line);
  }
  .card-preview .preview-skeleton{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: opacity .25s ease;
  }
  .card-preview .preview-skeleton .mono{
    font-family: var(--font-display);
    font-size: 22px;
    color: var(--sage);
    opacity: .6;
  }
  .card-preview .preview-skeleton .hint{
    font-size: 10.5px;
    color: var(--ink-soft);
    letter-spacing: .02em;
  }
  .card-preview.is-loaded .preview-skeleton{
    opacity: 0;
    pointer-events: none;
  }
  .card-preview iframe{
    position: absolute;
    top: 0;
    left: 0;
    width: 250%;
    height: 250%;
    border: 0;
    transform: scale(.4);
    transform-origin: 0 0;
    pointer-events: none;   /* preview saja, tidak untuk berinteraksi */
    opacity: 0;
    transition: opacity .3s ease;
  }
  .card-preview.is-loaded iframe{
    opacity: 1;
  }
  .card-preview .preview-badge{
    position: absolute;
    right: 8px;
    bottom: 8px;
    background: rgba(31,36,32,.72);
    color: #fff;
    font-size: 10px;
    letter-spacing: .03em;
    padding: 3px 7px;
    border-radius: 20px;
    pointer-events: none;
  }

  .card-icon{
    width: 52px;
    height: 52px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: var(--paper-soft);
    color: var(--sage-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 18px;
    letter-spacing: .02em;
  }
  .card-preview + .card-icon{
    display: none; /* kalau preview aktif, ikon bulat tidak perlu tampil lagi */
  }

  .card-name{
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px;
    color: var(--ink);
  }

  .card-sub{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 0;
  }

  /* baris tombol, tersembunyi sampai kartu diklik */
  .card-actions{
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    transition: grid-template-rows .22s ease, opacity .18s ease, margin-top .22s ease;
    margin-top: 0;
  }
  .card.is-open .card-actions{
    grid-template-rows: 1fr;
    opacity: 1;
    margin-top: 16px;
  }
  .card-actions-inner{
    overflow: hidden;
    display: flex;
    gap: 8px;
  }

  .btn{
    flex: 1;
    border: none;
    border-radius: var(--radius-sm);
    padding: 10px 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s ease, transform .12s ease;
  }
  .btn:hover{ opacity: .88; }
  .btn:active{ transform: scale(.95); }

  .btn-lihat{
    background: var(--sage-deep);
    color: #fff;
  }
  .btn-tanya{
    background: var(--paper-soft);
    color: var(--ink);
    border: 1px solid var(--line);
  }

  /* ---------- FAQ ---------- */
  section.faq{
    padding-top: 46px;
    padding-bottom: 8px;
    border-top: 1px solid var(--line);
  }
  .faq-head{
    text-align: center;
    margin-bottom: 26px;
  }
  .faq-head h2{
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(22px, 4.4vw, 28px);
    margin: 0 0 8px;
    color: var(--sage-deep);
  }
  .faq-head p{
    margin: 0 auto;
    max-width: 46ch;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .faq-list{
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .faq-item{
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 4px 20px;
    box-shadow: 0 2px 9px rgba(31,36,32,.045);
    transition: box-shadow .2s ease, border-color .2s ease;
  }
  .faq-item[open]{
    border-color: var(--gold);
    box-shadow: 0 14px 28px rgba(31,36,32,.09);
  }
  .faq-item summary{
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 0;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink);
  }
  .faq-item summary::-webkit-details-marker{ display: none; }
  .faq-item summary:active{ opacity: .65; }
  .faq-q{ flex: 1; }
  .faq-icon{
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--paper-soft);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    line-height: 1;
    color: var(--sage-deep);
    transition: transform .25s ease, background .2s ease, border-color .2s ease, color .2s ease;
  }
  .faq-item[open] .faq-icon{
    transform: rotate(45deg);
    background: var(--gold);
    border-color: var(--gold);
    color: #fff;
  }
  .faq-item p{
    margin: -4px 0 18px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ---------- FOOTER ---------- */
  footer{
    border-top: 1px solid var(--line);
    padding: 40px 20px 100px;
  }
  .footer-inner{
    text-align: center;
  }
  .footer-cta{
    margin: 0 0 18px;
  }
  .footer-cta a{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--wa);
    color: #fff;
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 600;
    padding: 11px 22px;
    border-radius: 40px;
    transition: background .15s ease, transform .12s ease;
  }
  .footer-cta a:hover{ background: var(--wa-deep); }
  .footer-cta a:active{ transform: scale(.96); }
  .footer-links{
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px 16px;
    margin: 0 0 10px;
  }
  .footer-links a{
    color: var(--sage-deep);
    text-decoration: none;
    font-size: 12.5px;
    font-weight: 600;
  }
  .footer-links a:hover{ text-decoration: underline; }
  .footer-hours{
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0 0 14px;
  }
  .footer-copy{
    color: var(--ink-soft);
    font-size: 12px;
    margin: 0;
  }
  .footer-copy a{
    color: var(--sage-deep);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* ---------- CARA PESAN ---------- */
  section.steps{
    padding-top: 46px;
    padding-bottom: 10px;
    border-top: 1px solid var(--line);
  }
  .steps-head{
    text-align: center;
    margin-bottom: 30px;
  }
  .steps-head h2{
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(22px, 4.4vw, 28px);
    margin: 0 0 8px;
    color: var(--sage-deep);
  }
  .steps-head p{
    margin: 0 auto;
    max-width: 46ch;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .steps-carousel{
    position: relative;
  }
  .steps-viewport{
    overflow: hidden;
  }
  .steps-arrow{
    display: none;
  }
  .steps-dots{
    display: none;
  }
  .steps-list{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px 16px;
  }
  .step-item{
    text-align: center;
    padding: 0 6px;
  }
  .step-num{
    width: 38px;
    height: 38px;
    margin: 0 auto 12px;
    border-radius: 50%;
    background: var(--sage-deep);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 16px;
  }
  .step-title{
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .step-desc{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 0;
    line-height: 1.5;
  }

  /* ---------- HARGA ---------- */
  .price-badge{
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 2;
    background: var(--gold);
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .01em;
    padding: 4px 10px;
    border-radius: 20px;
    box-shadow: 0 4px 10px rgba(185,139,46,.3);
    white-space: nowrap;
  }
  .tab-price-note{
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--sage-deep);
    margin: -6px 0 20px;
  }

  /* ---------- BUBBLE WHATSAPP MENGAMBANG ---------- */
  #wa-float{
    position: fixed;
    right: 18px;
    bottom: 18px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    z-index: 60;
    pointer-events: none;
  }

  #wa-note{
    max-width: 220px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: 12.5px;
    color: var(--ink);
    box-shadow: 0 6px 20px rgba(31,36,32,.10);
    position: relative;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
  }
  #wa-note.show{
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  #wa-note button{
    position: absolute;
    top: 4px;
    right: 6px;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }
  #wa-note strong{ display:block; margin-bottom:2px; color: var(--sage-deep); }

  .wa-btn-col{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .wa-label{
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .02em;
    color: #fff;
    background: var(--wa-deep);
    padding: 4px 11px;
    border-radius: 20px;
    white-space: nowrap;
    box-shadow: 0 5px 14px rgba(32,67,51,.28);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .25s ease .05s, transform .25s ease .05s;
    pointer-events: none;
  }
  .wa-label.show{
    opacity: 1;
    transform: translateY(0);
  }

  #wa-btn{
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--wa);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 22px rgba(32,67,51,.35);
    text-decoration: none;
    transform: scale(0);
    opacity: 0;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease, background .15s ease;
    pointer-events: none;
  }
  #wa-btn.show{
    transform: scale(1);
    opacity: 1;
    pointer-events: auto;
  }
  #wa-btn:hover{ background: var(--wa-deep); }
  #wa-btn:active{ transform: scale(.9); }
  #wa-btn svg{
    width: 26px;
    height: 26px;
    animation: wa-wiggle 6s ease-in-out infinite;
  }
  @keyframes wa-wiggle{
    0%, 88%, 100% { transform: rotate(0deg); }
    90% { transform: rotate(-14deg); }
    92% { transform: rotate(11deg); }
    94% { transform: rotate(-7deg); }
    96% { transform: rotate(4deg); }
    98% { transform: rotate(0deg); }
  }

  @media (max-width: 760px){
    .steps-list{
      display: block;
      grid-template-columns: none;
      position: relative;
      min-height: 190px;
    }
    .step-item{
      display: block;
      position: absolute;
      inset: 0;
      padding: 0 46px;
      opacity: 0;
      transform: translateX(8px);
      pointer-events: none;
      transition: opacity .3s ease, transform .3s ease;
    }
    .step-item.is-active{
      position: relative;
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }
    .steps-arrow{
      display: flex;
      position: absolute;
      top: 32px;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--line);
      color: var(--sage-deep);
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(31,36,32,.09);
      z-index: 2;
      transition: opacity .15s ease, transform .12s ease;
    }
    .steps-arrow:active{ transform: scale(.9); }
    .steps-arrow:disabled{ opacity: .3; cursor: default; }
    .steps-arrow-prev{ left: -4px; }
    .steps-arrow-next{ right: -4px; }
    .steps-dots{
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 22px;
    }
    .steps-dot{
      width: 8px;
      height: 8px;
      padding: 0;
      border: none;
      border-radius: 5px;
      background: var(--line);
      cursor: pointer;
      transition: width .25s ease, background .25s ease;
    }
    .steps-dot.active{
      width: 22px;
      background: var(--gold);
    }
  }

  @media (max-width: 480px){
    header.hero{ padding: 44px 0 32px; }
    .tabs-nav{ justify-content: flex-start; }
    .grid{ grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
    .card{ padding: 20px 14px 18px; }
    #wa-note{ max-width: 168px; }
  }

  /* ---------- TAMPILAN LAPTOP / DESKTOP ---------- */
  @media (min-width: 1024px){
    :root{ --maxw: 1060px; --gap: 24px; }

    header.hero{ padding: 76px 0 56px; }
    .logo-badge{ width: 88px; height: 88px; }
    p.tagline{ font-size: 17px; }

    .grid{ grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }

    @media (hover: hover) and (pointer: fine){
      .card{ transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease; }
      .card:hover{
        transform: translateY(-4px);
        box-shadow: 0 14px 30px rgba(31,36,32,.10);
      }
    }

    section.faq{ padding: 64px 0 16px; }
    .faq-list{
      max-width: 920px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      align-items: start;
      gap: 12px 18px;
    }
  }
</style>
</head>
<body>

  <header class="hero">
    <div class="wrap">

  /* ============================================================
     3. LOGIKA RENDER (tidak perlu diedit untuk pemakaian biasa)

  // --- Isi teks-teks dari CONFIG ---
  document.title = CONFIG.siteTitle;
  document.getElementById('site-title').textContent = CONFIG.siteTitle;
  document.getElementById('site-tagline').textContent = CONFIG.tagline;
  document.getElementById('site-intro').textContent = CONFIG.introText;
  document.getElementById('footer-text').innerHTML = CONFIG.footerText;

  // --- Footer: tombol WA, link sosial media, jam respon ---
  document.getElementById('footer-wa-link').href = buildWaLink(CONFIG.siteTitle);

  const footerLinks = document.getElementById('footer-links');
  (CONFIG.socialLinks || []).forEach(function(item){
    const a = document.createElement('a');
    a.href = item.url;
    a.textContent = item.label;
    a.target = '_blank';

    footerLinks.appendChild(a);
  });
  if (!CONFIG.socialLinks || !CONFIG.socialLinks.length){
    footerLinks.style.display = 'none';
  }

  const footerHours = document.getElementById('footer-hours');
  if (CONFIG.responseHours){
    footerHours.textContent = CONFIG.responseHours;
  } else {
    footerHours.style.display = 'none';
  }

  // --- Logo: coba beberapa sumber gambar Google Drive, lalu fallback teks ---
  (function loadLogo(){
    const badge = document.getElementById('logo-badge');
    const id = CONFIG.logoDriveId;
    const sources = id ? [
      "https://lh3.googleusercontent.com/d/" + id + "=w300",
      "https://drive.google.com/uc?export=view&id=" + id,
      "https://drive.google.com/thumbnail?id=" + id + "&sz=w300"
    ] : [];

    const img = new Image();
    img.alt = CONFIG.siteTitle + " logo";
    let i = 0;

    function tryNext(){
      if (i >= sources.length){
        const fallback = document.createElement('span');
        fallback.className = 'logo-fallback';
        fallback.textContent = CONFIG.logoInitials || CONFIG.siteTitle.slice(0,2).toUpperCase();
        badge.appendChild(fallback);
        return;
      }
      img.src = sources[i++];
    }

    img.onload = function(){ badge.appendChild(img); };
    img.onerror = tryNext;
    tryNext();
  })();

  function initials(name){
    return name
      .split(/\s+/)
      .filter(Boolean)
      .slice(0, 2)
      .map(w => w[0].toUpperCase())
      .join('');
  }

  // --- Bangun "Cara Pesan" dari CONFIG.steps ---
  const stepsList = document.getElementById('steps-list');
  (CONFIG.steps || []).forEach(function(step, i){
    const item = document.createElement('div');
    item.className = 'step-item';
    item.innerHTML =
      '<div class="step-num">' + (i + 1) + '</div>' +
      '<p class="step-title">' + step.title + '</p>' +
      '<p class="step-desc">' + step.desc + '</p>';
    stepsList.appendChild(item);
  });

  // --- Kontrol carousel "Cara Pesan" (klik panah / dots, khusus mobile) ---
  const stepsTotal = (CONFIG.steps || []).length;
  const stepsPrevBtn = document.getElementById('steps-prev');
  const stepsNextBtn = document.getElementById('steps-next');
  const stepsDotsWrap = document.getElementById('steps-dots');
  let stepIndex = 0;

  for (let i = 0; i < stepsTotal; i++){
    const dot = document.createElement('button');
    dot.type = 'button';
    dot.className = 'steps-dot';
    dot.setAttribute('aria-label', 'Ke langkah ' + (i + 1));
    dot.addEventListener('click', function(){
      stepIndex = i;
      updateStepsCarousel();
    });
    stepsDotsWrap.appendChild(dot);
  }

  function isMobileSteps(){
    return window.matchMedia('(max-width: 760px)').matches;
  }

  function updateStepsCarousel(){
    const mobile = isMobileSteps();
    Array.from(stepsList.children).forEach(function(item, i){
      item.classList.toggle('is-active', !mobile || i === stepIndex);
    });
    Array.from(stepsDotsWrap.children).forEach(function(dot, i){
      dot.classList.toggle('active', i === stepIndex);
    });
    stepsPrevBtn.disabled = stepIndex === 0;
    stepsNextBtn.disabled = stepIndex === stepsTotal - 1;
  }

  stepsPrevBtn.addEventListener('click', function(){
    if (stepIndex > 0){ stepIndex--; updateStepsCarousel(); }
  });
  stepsNextBtn.addEventListener('click', function(){
    if (stepIndex < stepsTotal - 1){ stepIndex++; updateStepsCarousel(); }
  });
  window.addEventListener('resize', updateStepsCarousel);
  updateStepsCarousel();

  function buildWaLink(name){
    const msg = CONFIG.waMessageTemplate.replace('{name}', name);
    return "https://wa.me/" + CONFIG.whatsappNumber + "?text=" + encodeURIComponent(msg);
  }

  // Preview HANYA dimuat saat kartu diketuk terbuka — jaga performa di HP.
  function loadPreview(box){
    if (!box || box.querySelector('iframe')) return;
    const url = box.getAttribute('data-url');
    if (!url) return;
    const iframe = document.createElement('iframe');
    iframe.loading = 'lazy';
    iframe.referrerPolicy = 'no-referrer';
    iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-forms');
    iframe.setAttribute('tabindex', '-1');
    iframe.setAttribute('aria-hidden', 'true');
    iframe.src = url;
    iframe.addEventListener('load', function(){
      box.classList.add('is-loaded');
    });
    box.appendChild(iframe);
  }

  // Hanya satu kartu boleh terbuka (menampilkan tombol Lihat/Tanya) dalam satu waktu
  let openCard = null;

  // Semua kotak preview akan ditampung di sini, lalu dimuat otomatis
  // secara bertahap (lihat bagian bawah) supaya HP tidak lag saat
  // membuka banyak website sekaligus.
  const allPreviewBoxes = [];

  // --- Bangun satu kartu ---
  function buildCard(link){
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-expanded', 'false');

    const showPreview = CONFIG.previewEnabled && link.preview !== false;

    const previewHtml = showPreview
      ? '<div class="card-preview" data-url="' + link.url + '">' +
          '<div class="preview-skeleton">' +
            '<span class="mono">' + initials(link.name) + '</span>' +
            '<span class="hint">memuat pratinjau…</span>' +
          '</div>' +
          '<span class="preview-badge">pratinjau</span>' +
        '</div>'
      : '';

    card.innerHTML =
      previewHtml +
      (link.priceFrom ? '<span class="price-badge">Mulai ' + link.priceFrom + '</span>' : '') +
      '<div class="card-icon">' + initials(link.name) + '</div>' +
      '<p class="card-name">' + link.name + '</p>' +
      (CONFIG.cardSubLabel ? '<p class="card-sub">' + CONFIG.cardSubLabel + '</p>' : '') +
      '<div class="card-actions"><div class="card-actions-inner">' +
        '<button type="button" class="btn btn-lihat">Lihat</button>' +
        '<button type="button" class="btn btn-tanya">Tanya</button>' +
      '</div></div>';

    const previewBox = showPreview ? card.querySelector('.card-preview') : null;
    if (previewBox) allPreviewBoxes.push(previewBox);

    function toggleOpen(){
      const willOpen = !card.classList.contains('is-open');

      if (openCard && openCard !== card){
        openCard.classList.remove('is-open');
        openCard.setAttribute('aria-expanded', 'false');
      }

      card.classList.toggle('is-open', willOpen);
      card.setAttribute('aria-expanded', String(willOpen));
      openCard = willOpen ? card : null;
    }

    card.addEventListener('click', function(e){
      if (e.target.closest('.btn')) return; // biar tombol punya handler sendiri
      toggleOpen();
    });
    card.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        toggleOpen();
      }
    });

    card.querySelector('.btn-lihat').addEventListener('click', function(e){
      e.stopPropagation();
      window.open(link.url, '_blank', 'noopener');
    });

    card.querySelector('.btn-tanya').addEventListener('click', function(e){
      e.stopPropagation();
      showWaBubble(link.name);
    });

    return card;
  }

  // --- Bangun tab navigasi + panel dari CONFIG.tabs ---
  const tabsNav = document.getElementById('tabs-nav');
  const tabIndicator = document.getElementById('tab-indicator');
  const tabPanels = document.getElementById('tab-panels');

  const tabButtons = [];

  CONFIG.tabs.forEach(function(tab, index){
    // Tombol tab
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tab-btn';
    btn.id = 'tab-btn-' + tab.id;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-controls', 'panel-' + tab.id);
    btn.setAttribute('aria-selected', index === 0 ? 'true' : 'false');
    btn.textContent = tab.label;
    btn.addEventListener('click', function(){ activateTab(tab.id); });
    tabsNav.insertBefore(btn, tabIndicator);
    tabButtons.push(btn);

    // Panel + grid kartu
    const panel = document.createElement('div');
    panel.className = 'tab-panel';
    panel.id = 'panel-' + tab.id;
    panel.setAttribute('role', 'tabpanel');
    panel.setAttribute('aria-labelledby', btn.id);
    if (index !== 0) panel.hidden = true;

    if (tab.priceNote){
      const priceNote = document.createElement('p');
      priceNote.className = 'tab-price-note';
      priceNote.textContent = tab.priceNote;
      panel.appendChild(priceNote);
    }

    const grid = document.createElement('div');
    grid.className = 'grid';
    tab.links.forEach(function(link){
      grid.appendChild(buildCard(link));
    });
    panel.appendChild(grid);
    tabPanels.appendChild(panel);
  });

  function moveIndicator(btn){
    if (!btn) return;
    tabIndicator.style.left = btn.offsetLeft + 'px';
    tabIndicator.style.width = btn.offsetWidth + 'px';
  }

  function activateTab(id){
    CONFIG.tabs.forEach(function(tab){
      const btn = document.getElementById('tab-btn-' + tab.id);
      const panel = document.getElementById('panel-' + tab.id);
      const active = tab.id === id;
      btn.setAttribute('aria-selected', String(active));
      panel.hidden = !active;
      if (active) moveIndicator(btn);
    });
  }

  // --- Bangun daftar FAQ dari CONFIG.faq ---
  const faqList = document.getElementById('faq-list');
  (CONFIG.faq || []).forEach(function(item, i){
    const details = document.createElement('details');
    details.className = 'faq-item';

    const summary = document.createElement('summary');

    const qSpan = document.createElement('span');
    qSpan.className = 'faq-q';
    qSpan.textContent = item.q;

    const iconSpan = document.createElement('span');
    iconSpan.className = 'faq-icon';
    iconSpan.textContent = '+';
    iconSpan.setAttribute('aria-hidden', 'true');

    summary.appendChild(qSpan);
    summary.appendChild(iconSpan);

    const answer = document.createElement('p');
    answer.textContent = item.a;

    details.appendChild(summary);
    details.appendChild(answer);
    faqList.appendChild(details);
  });

  // Posisi awal indikator + reposisi saat ukuran layar berubah
  window.addEventListener('load', function(){ moveIndicator(tabButtons[0]); });
  window.addEventListener('resize', function(){
    const current = tabButtons.find(b => b.getAttribute('aria-selected') === 'true');
    moveIndicator(current);
  });
  moveIndicator(tabButtons[0]);

  // --- Muat semua preview secara otomatis, satu per satu dengan jeda ---
  // Jeda antar-preview mencegah semua iframe dirender bersamaan (penyebab
  // utama lag di HP). Ubah STAGGER_MS untuk mempercepat/memperlambat.
  const STAGGER_MS = 220;
  allPreviewBoxes.forEach(function(box, i){
    setTimeout(function(){ loadPreview(box); }, i * STAGGER_MS);
  });

  // --- Bubble WhatsApp mengambang ---
  const waBtn = document.getElementById('wa-btn');
  const waLabel = document.getElementById('wa-label');
  const waNote = document.getElementById('wa-note');
  const waNoteTitle = document.getElementById('wa-note-title');
  let hideTimer = null;

  // Tombol WA + label "Tanya Abibo" langsung tampil sejak halaman dibuka,
  // dengan pesan konsultasi umum (bukan menunggu kartu produk diketuk).
  waBtn.href = buildWaLink(CONFIG.siteTitle);
  waBtn.classList.add('show');
  waLabel.classList.add('show');

  function showWaBubble(name){
    waBtn.href = buildWaLink(name);
    waNoteTitle.textContent = 'Tanya soal "' + name + '"';
    waBtn.classList.add('show');
    waNote.classList.add('show');

    clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){
      waNote.classList.remove('show');
    }, 6000);
  }

  document.getElementById('wa-note-close').addEventListener('click', function(){
    waNote.classList.remove('show');
  });

  // --- Animasi scroll reveal (fade + naik sedikit saat elemen masuk layar) ---
  // Otomatis nonaktif kalau browser tidak mendukung IntersectionObserver,
  // atau pengguna mengaktifkan "prefers-reduced-motion" di sistemnya.
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if ('IntersectionObserver' in window && !prefersReducedMotion){
    const revealTargets = document.querySelectorAll(
      '.card, .faq-item, .steps-head, .faq-head'
    );
    revealTargets.forEach(function(el, i){
      el.classList.add('reveal');
      el.style.transitionDelay = (i % 5) * 70 + 'ms';
    });

    const revealObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting){
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -30px 0px' });

    revealTargets.forEach(function(el){ revealObserver.observe(el); });
  }

})();
</script>
</body>
</html>
